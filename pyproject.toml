[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oauth-for-dummies"
version = "1.1.0"
description = "Learn how OAuth 2.0 works by running it, then add OAuth login to FastAPI in one command. Interactive OAuth debugger, 6 providers, PKCE."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = [
    "oauth", "oauth2", "oauth2.0", "openid-connect", "oidc", "pkce",
    "fastapi", "authentication", "authorization", "login", "sso",
    "social-login", "sign-in-with-google", "sign-in-with-github",
    "oauth-debugger", "oauth-tutorial", "oauth-example", "learn-oauth",
    "github", "google", "discord", "spotify", "microsoft", "linkedin",
    "cli", "scaffold", "security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/pranavkumaarofficial/oauth-for-dummies"
Repository = "https://github.com/pranavkumaarofficial/oauth-for-dummies"
Issues = "https://github.com/pranavkumaarofficial/oauth-for-dummies/issues"

[project.scripts]
oauth-init = "oauth_for_dummies.cli:main"

[tool.setuptools.packages.find]
include = ["oauth_for_dummies*"]

[tool.setuptools.package-data]
oauth_for_dummies = ["scaffold/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
